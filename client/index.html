<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vault — Personal Finance Tracker</title>
    <meta name="theme-color" content="#111714" />
    <!-- Modern Fintech Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Telegram WebApp JS Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Immediate Telegram WebApp initialization before React DOM mounts
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (err) {
        console.warn('Initial Telegram WebApp trigger error:', err);
      }
    </script>
  </head>
  <body class="antialiased touch-manipulation overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
